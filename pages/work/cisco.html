  </head>
  <body>

<section class="lgx-wrap" aria-label="Brand gallery">
  <!-- Logo -->
  <div class="lgx-logo">
    <img src="/images/BW_Logo_Horizontal_White.png" alt="BlackWood logo" />
  </div>

  <!-- Image Grid (no text/captions) -->
  <div class="lgx-grid">
    <!-- For portrait images, set --ratio to something like 2/3 or 9/16 -->
    <figure class="lgx-item" style="--d:0ms; --ratio: 2/3">
      <img src="/images/Cisco Networking Cloud/Cisco Networking Cloud/01.jpg"
           alt="Gallery image 1" loading="lazy" />
      <span class="lgx-shine" aria-hidden="true"></span>
    </figure>

    <figure class="lgx-item" style="--d:120ms; --ratio: 2/3">
      <img src="/images/Cisco Networking Cloud/Cisco Networking Cloud/02.jpg"
           alt="Gallery image 2" loading="lazy" />
      <span class="lgx-shine" aria-hidden="true"></span>
    </figure>

    <figure class="lgx-item" style="--d:240ms; --ratio: 2/3">
      <img src="/images/Cisco Networking Cloud/Cisco Networking Cloud/03.jpg"
           alt="Gallery image 3" loading="lazy" />
      <span class="lgx-shine" aria-hidden="true"></span>
    </figure>

    <figure class="lgx-item" style="--d:360ms; --ratio: 2/3">
      <img src="/images/Cisco Networking Cloud/Cisco Networking Cloud/04.jpg"
           alt="Gallery image 4" loading="lazy" />
      <span class="lgx-shine" aria-hidden="true"></span>
    </figure>

    <figure class="lgx-item" style="--d:480ms; --ratio: 2/3">
      <img src="/images/Cisco Networking Cloud/Cisco Networking Cloud/05.jpg"
           alt="Gallery image 5" loading="lazy" />
      <span class="lgx-shine" aria-hidden="true"></span>
    </figure>

    <figure class="lgx-item" style="--d:600ms; --ratio: 2/3">
      <img src="/images/Cisco Networking Cloud/Cisco Networking Cloud/06.jpg"
           alt="Gallery image 6" loading="lazy" />
      <span class="lgx-shine" aria-hidden="true"></span>
    </figure>
  </div>

  <!-- Back Button -->
  <div class="lgx-actions">
    <button class="lgx-btn" type="button" aria-label="Go back" onclick="window.history.back()">
      <span>Back</span>
    </button>
  </div>
</section>

<style>
/* ===== Scoped to .lgx-* only ===== */
.lgx-wrap {
  position: relative;
  isolation: isolate;
  background: #1f1f1f; /* Section background */
  padding: clamp(32px, 5vw, 64px) clamp(16px, 4vw, 48px);
  color: #fff;
}

/* Logo block */
.lgx-logo {
  display: grid;
  place-items: center;
  margin-bottom: clamp(20px, 4vw, 40px);
}
.lgx-logo img {
  width: min(420px, 55vw);
  height: auto;
  filter: drop-shadow(0 6px 18px rgba(0,0,0,.25));
  transform: translateY(12px) scale(.98);
  opacity: 0;
  animation: lgx-fadeUp .9s cubic-bezier(.2,.7,.2,1) .1s both;
}

/* Grid */
.lgx-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: clamp(14px, 2.2vw, 26px);
  margin: 0 auto;
  max-width: 1600px;
}

/* Items — fixed ratio wrapper; contains image fully */
.lgx-item {
  --r: 18px;
  --ratio: 4/3;                  /* default; override per item for portraits */
  position: relative;
  overflow: hidden;              /* IMPORTANT: keep content inside card */
  border-radius: var(--r);
  transform-style: preserve-3d;
  background: rgba(255,255,255,.02);
  box-shadow: 0 10px 28px rgba(0,0,0,.28);
  border: 1px solid rgba(255,255,255,.08);
  aspect-ratio: var(--ratio);
  display: grid;
  place-items: center;

  /* entry animation (staggered via --d) */
  opacity: 0;
  transform: translateY(24px) scale(.985) rotateX(2deg);
  animation: lgx-cardIn .9s cubic-bezier(.2,.7,.2,1) var(--d,0ms) both;
}

/* Full containment: no crop, no overflow, no zoom */
.lgx-item img {
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;           /* SHOW FULL IMAGE within the card */
  object-position: center;
  display: block;
  transition: filter .35s ease;  /* keep a light polish */
}

/* Shine sweep on hover */
.lgx-shine {
  position: absolute; inset: -30% -60%;
  background:
    radial-gradient(60% 60% at 50% 50%, rgba(255,255,255,.16), transparent 60%),
    linear-gradient(110deg, transparent 40%, rgba(255,255,255,.18) 50%, transparent 60%);
  mix-blend-mode: screen;
  pointer-events: none;
  transform: translateX(-60%) skewX(-10deg);
  opacity: 0;
  transition: opacity .4s ease;
}

/* Hover: subtle lift + sheen (image stays contained) */
.lgx-item:hover {
  transform: translateY(-2px) scale(1) rotateX(.6deg) rotateY(-.6deg);
  box-shadow: 0 16px 40px rgba(0,0,0,.35);
}
.lgx-item:hover img { filter: saturate(1.04) contrast(1.02); }
.lgx-item:hover .lgx-shine {
  opacity: .9;
  animation: lgx-sheen 3s ease-in-out infinite;
}

/* Back button */
.lgx-actions {
  display: grid;
  place-items: center;
  margin-top: clamp(20px, 4vw, 40px);
}
.lgx-btn {
  --btn-border: color-mix(in srgb, #ffffff 30%, transparent);
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .5em;
  padding: .85em 1.35em;
  border-radius: 999px;
  font-weight: 600;
  border: 1px solid var(--btn-border);
  color: #fff;
  background: linear-gradient(0deg, rgba(255,255,255,.06), rgba(255,255,255,0));
  box-shadow: 0 8px 22px rgba(0,0,0,.25);
  cursor: pointer;
  transition: transform .2s ease, box-shadow .3s ease, border-color .3s ease, background .3s ease;
}
.lgx-btn::before {
  content: "";
  position: absolute; inset: 0; border-radius: inherit;
  background: radial-gradient(120% 120% at 0% 0%, rgba(255,255,255,.18), transparent 70%);
  opacity: 0; transition: opacity .3s ease;
}
.lgx-btn:hover {
  transform: translateY(-1px);
  border-color: color-mix(in srgb, #ffffff 45%, transparent);
  box-shadow: 0 14px 32px rgba(0,0,0,.35);
}
.lgx-btn:hover::before { opacity: 1; }
.lgx-btn:active { transform: translateY(0); }
.lgx-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(255,255,255,.24); }

/* =========================
   Responsive Media Queries
   ========================= */

/* ≥1600px */
@media (min-width: 1600px) {
  .lgx-grid { max-width: 1780px; gap: 28px; }
  .lgx-logo img { width: 460px; }
}

/* 1200–1599px */
@media (max-width: 1599.98px) and (min-width: 1200px) {
  .lgx-grid { grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .lgx-logo img { width: 420px; }
}

/* 1024–1199px */
@media (max-width: 1199.98px) and (min-width: 1024px) {
  .lgx-grid { grid-template-columns: repeat(3, 1fr); gap: 22px; }
  .lgx-logo img { width: 380px; }
}

/* 900–1023px */
@media (max-width: 1023.98px) and (min-width: 900px) {
  .lgx-grid { grid-template-columns: repeat(2, 1fr); gap: 22px; }
  .lgx-logo img { width: 360px; }
}

/* 768–899px */
@media (max-width: 899.98px) and (min-width: 768px) {
  .lgx-grid { grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .lgx-logo img { width: 340px; }
}

/* 640–767px */
@media (max-width: 767.98px) and (min-width: 640px) {
  .lgx-grid { grid-template-columns: repeat(2, 1fr); gap: 18px; }
  .lgx-logo img { width: 300px; }
  .lgx-btn { width: auto; }
}

/* 480–639px */
@media (max-width: 639.98px) and (min-width: 480px) {
  .lgx-grid { grid-template-columns: 1fr; gap: 16px; }
  .lgx-logo img { width: 260px; }
  .lgx-btn { width: 100%; max-width: 360px; }
}

/* 360–479px */
@media (max-width: 479.98px) and (min-width: 360px) {
  .lgx-grid { grid-template-columns: 1fr; gap: 14px; }
  .lgx-logo img { width: 220px; }
  .lgx-btn { width: 100%; max-width: 320px; }
}

/* <360px */
@media (max-width: 359.98px) {
  .lgx-grid { grid-template-columns: 1fr; gap: 12px; }
  .lgx-logo img { width: 200px; }
  .lgx-btn { width: 100%; max-width: 280px; }
}

/* Keyframes */
@keyframes lgx-fadeUp {
  from { opacity: 0; transform: translateY(20px) scale(.98); }
  to   { opacity: 1; transform: translateY(0)    scale(1); }
}
@keyframes lgx-cardIn {
  from { opacity: 0; transform: translateY(24px) scale(.985) rotateX(2deg); }
  to   { opacity: 1; transform: translateY(0)    scale(1)    rotateX(0); }
}
@keyframes lgx-sheen {
  0%, 20%   { transform: translateX(-60%) skewX(-10deg); opacity: 0; }
  30%, 55%  { transform: translateX(0%)   skewX(-10deg); opacity: .7; }
  70%, 100% { transform: translateX(80%)  skewX(-10deg); opacity: 0; }
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  .lgx-logo img, .lgx-item, .lgx-item img, .lgx-shine {
    animation: none !important; transition: none !important;
  }
  .lgx-item, .lgx-logo img { opacity: 1; transform: none; }
}
</style>
  </body>
</html>
